<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>

    <title>Daily Schedule</title>
</head>

<body>
    <header>
        <h1 id="day-schedule">Schedule Type</h1>
        <p id="current-date">Date</p>
    </header>

    <main id="schedule">
        <section id="period-cards">
            <!-- js generated schedule cards go here -->
        </section>
    </main>

    <section id="right-sidebar">
        <div class="load-schedule">
            <input type="date" id="load-schedule-input"> <br>
            <button id="load-schedule">Load Schedule</button>
        </div>

        <div class="timer-body">
            <h2 id="timer-text">Time Remaining</h3>
        </div>

        <div class="week-schedule" id="week-schedule">
            <p id="sunday" fill="none">Sunday</p>
            <p id="monday" fill="none">Monday</p>
            <p id="tuesday" fill="none">Tuesday</p>
            <p id="wednesday" fill="none">Wednesday</p>
            <p id="thursday" fill="none">Thrusday</p>
            <p id="friday" fill="none">Friday</p>
            <p id="saturday" fill="none">Saturday</p>
        </div>

        <div class="messages">
            <h3>"O ‘Iolani, at thy call we gather" - Rev. Albert Hendrix Stone, 1938</h3>
        </div>

        <div class="status">
            
            <p id="connection-status">Connection Status</p> 
            <p id="cache-status">Calendar Status</p>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>

    <title>Daily Schedule</title>
</head>

<body>
    <header>
        <h1 id="day-schedule">Schedule Type</h1>
        <p id="current-date">Date</p>
    </header>

    <main id="schedule">
        <section>
            <!-- js generated schedule cards go here -->
        </section>
    </main>

    <section id="right-sidebar">
        <div class="load-schedule">
            <input type="date" id="load-schedule-input"> <br>
            <button id="load-schedule">Load Schedule</button>
        </div>

        <div class="week-schedule">
            <p>Monday</p>
            <p>Tuesday</p>
            <p>Wednesday</p>
            <p>Thrusday</p>
            <p>Friday</p>
        </div>

        <div class="messages">
            <h3>"let it goooooo. let it gooooo" - Frozen 2013</h3>
        </div>

        <div class="status">
            
            <p id="connection-status">Connection Status</p> 
            <p id="cache-status">Calendar Status</p>
        </div>
    </section>

</body>
</html>
